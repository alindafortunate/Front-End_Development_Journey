<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Table</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <table>
            <caption>Weekly Meeting Availability Schedule</caption>
            <thead>
                <tr>
                <th scope="col">Time</th>
                <th scope="col">Sunday</th>
                <th scope="col">Monday</th>
                <th scope="col">Tuesday</th>
                <th scope="col">Wednesday</th>
                <th scope="col">Thursday</th>
                <th scope="col">Friday</th>
                <th scope="col">Saturday</th>
                
            </tr>
            </thead>
            <tbody>
                <tr class="sharp">
                    <th class="time" scope="row"><time datetime="10:00">10:00</time></th>
                    <td class="available-0" aria-label="0 available">0</td>
                    <td class="available-1" aria-label="1 available">1</td>
                    <td class="available-2" aria-label="2 available">2</td>
                    <td class="available-3" aria-label="3 available">3</td>
                    <td class="available-4" aria-label="4 available">4</td>
                    <td class="available-5" aria-label="5+ available">15</td>
                    <td class="available-4" aria-label="4 available">4</td>           
                </tr>
                <tr class="half">
                    <th class="time" scope="row"><time datetime="11:00">11:00</time></th>
                    <td class="available-0" aria-label="0 available">0</td>
                    <td class="available-1" aria-label="1 available">1</td>
                    <td class="available-2" aria-label="2 available">2</td>
                    <td class="available-3" aria-label="3 available">3</td>
                    <td class="available-4" aria-label="4 available">4</td>
                    <td class="available-5" aria-label="5+ available">5</td>
                    <td class="available-4" aria-label="4 available">4</td>
                </tr>
                <tr class="sharp">
                    <th class="time" scope="row"><time datetime="12:00">12:00</time></th>
                    <td class="available-0" aria-label="0 available">0</td>
                    <td class="available-1" aria-label="1 available">1</td>
                    <td class="available-2" aria-label="2 available">2</td>
                    <td class="available-3" aria-label="3 available">3</td>
                    <td class="available-4" aria-label="4 available">4</td>
                    <td class="available-5" aria-label="5+ available">7</td>
                    <td class="available-4" aria-label="4 available">4</td>
                </tr>
                <tr class="half">
                    <th class="time" scope="row"><time datetime="13:00">13:00</time></th>
                    <td class="available-0" aria-label="0 available">0</td>
                    <td class="available-1" aria-label="1 available">1</td>
                    <td class="available-2" aria-label="2 available">2</td>
                    <td class="available-3" aria-label="3 available">3</td>
                    <td class="available-4" aria-label="4 available">4</td>
                    <td class="available-5" aria-label="5+ available">9</td>
                    <td class="available-4" aria-label="4 available">4</td>
                </tr>                    
                <tr class="sharp">
                    <th class="time" scope="row"><time datetime="16:00">16:00</time></th>
                    <td class="available-1" aria-label="1 available">1</td>
                    <td class="available-0" aria-label="0 available">0</td>
                    <td class="available-3" aria-label="3 available">3</td>
                    <td class="available-2" aria-label="2 available">2</td>
                    <td class="available-4" aria-label="4 available">4</td>
                    <td class="available-5" aria-label="5+ available">6</td>
                    <td class="available-4" aria-label="4 available">4</td>
                </tr>
            </tbody>
            
        </table>
        <div id="legend">
            <span>Availability</span>
            <div id="legend-gradient"></div>
        </div>        
        
    </main>

</body>

</html>
