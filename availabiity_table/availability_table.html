<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Table</title>
</head>

<body>
    <main>
        <table>
            <caption>Weekly Meeting Availability Schedule</caption>
            <thead>
                <tr>
                <th scope="col">Sunday</th>
                <th scope="col">Monday</th>
                <th scope="col">Tuesday</th>
                <th scope="col">Wednesday</th>
                <th scope="col">Thursday</th>
                <th scope="col">Friday</th>
                <th scope="col">Saturday</th>
                
            </tr>
            </thead>
            <tbody>
                <tr>
                    <th class="time"><time datetime="10:00">10:00</time></th>
                    <th class="time"><time datetime="11:00">11:00</time></th>
                    <th class="time"><time datetime="12:00">12:00</time></th>
                    <th class="time"><time datetime="13:00">13:00</time></th>
                    <th class="time"><time datetime="14:00">14:00</time></th>
                    <th class="time"><time datetime="15:00">15:00</time></th>
                    <th class="time"><time datetime="16:00">16:00</time></th>

                </tr>
            </tbody>
            
        </table>
    </main>

</body>

</html>
