<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>The MultiMedia Player</h1>
  <section>
    <h2>Mary's Born Child.</h2>
    <audio controls aria-label="Mary's born child audio">
      <source src='https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3' type='audio/mp3'>
    </audio>
  </section>
  <section>
    <h2>Moses' life in Egypt.</h2>
    <video controls width='400' aria-label="Moses' life in Egypt.">
      <source src='https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4' type='video/mp4'/>
      <track src='subtitles-en.vtt' kind='subtitles' srclang='en' label='English'>
      
    </video>
  </section>
  <section>
    <h2>Transcript for Moses' life in Egypt</h2>
    <p>Moses' life in Egypt is a great example to learn from if you want to understand part of God's will for your life.</p>
  </section>
</body>

</html>
